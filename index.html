<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개구리 러닝</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #d9f2ff;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  /* 화면에 꽉 차게: 가로는 최대 1280px, 세로가 짧으면 세로에 맞춤 */
  #wrap { position: relative; width: 100%; max-width: min(1280px, calc((100vh - 80px) * 2)); }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 16px;
    border: 4px solid #3c9a4a;
    cursor: pointer;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(20, 60, 30, 0.6);
    border-radius: 16px;
    text-align: center;
    padding: 16px;
    overflow: auto;
  }
  #overlay.hidden { display: none; }
  .hide { display: none !important; }
  #title {
    font-size: clamp(32px, 8vw, 72px);
    font-weight: 900;
    color: #eaffd9;
    text-shadow: 0 0 16px #4cd964, 0 4px 0 #1f6b2c;
  }
  #title.over  { color: #ffb3b3; text-shadow: 0 0 16px #ff4d4d, 0 4px 0 #7a1f1f; }
  #title.clear { color: #fff3b0; text-shadow: 0 0 16px #ffc800, 0 4px 0 #8a6a00; }
  #sub { font-size: clamp(13px, 2.5vw, 18px); color: #ffffff; line-height: 1.6; }
  #nameRow { display: flex; gap: 8px; align-items: center; color: #fff; font-size: clamp(14px, 2.5vw, 18px); }
  #nameInput {
    font-family: inherit;
    font-size: clamp(14px, 2.5vw, 18px);
    padding: 8px 14px;
    border-radius: 10px;
    border: 3px solid #fff;
    width: 180px;
    text-align: center;
  }
  #pick { display: flex; gap: 12px; }
  .pick {
    font-family: inherit;
    font-size: clamp(14px, 2.5vw, 18px);
    padding: 8px 18px;
    border-radius: 999px;
    border: 3px solid #fff;
    background: rgba(255,255,255,0.2);
    color: #fff;
    cursor: pointer;
  }
  .pick.on { background: #fff; color: #2f7d3a; font-weight: bold; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .bigBtn {
    font-family: inherit;
    font-size: clamp(18px, 3.5vw, 26px);
    font-weight: bold;
    padding: 12px 34px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(#7be07b, #3cb44b);
    color: #fff;
    box-shadow: 0 6px 0 #1f7a2c;
    cursor: pointer;
  }
  .bigBtn.gray { background: linear-gradient(#c9d6cc, #93a698); box-shadow: 0 6px 0 #5d6e61; }
  .bigBtn:hover  { filter: brightness(1.1); }
  .bigBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f7a2c; }
  /* 랭킹 표 */
  #ranking {
    background: rgba(255,255,255,0.92);
    border-radius: 12px;
    padding: 10px 16px;
    min-width: min(420px, 90%);
    color: #2f4f2f;
  }
  #ranking h3 { margin-bottom: 6px; font-size: 18px; }
  #rankList { list-style: none; font-size: clamp(12px, 2vw, 15px); }
  #rankList li {
    display: grid;
    grid-template-columns: 36px 1fr 70px 80px;
    gap: 6px;
    padding: 3px 6px;
    border-radius: 6px;
    text-align: left;
  }
  #rankList li.head { font-weight: bold; color: #6b8f6b; }
  #rankList li.me { background: #fff3b0; font-weight: bold; }
  #rankList li span:nth-child(3), #rankList li span:nth-child(4) { text-align: right; }
  #help { margin-top: 12px; font-size: 14px; color: #3c6e47; text-align: center; }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="960" height="480"></canvas>
  <div id="overlay">
    <div id="title">개구리 러닝</div>
    <div id="sub">장애물을 뛰어넘고 코인을 모아 13단계까지 달려라!</div>
    <div id="nameRow">
      닉네임
      <input id="nameInput" maxlength="10" placeholder="이름을 적어줘">
    </div>
    <div id="pick">
      <button class="pick on" data-kind="prince">👑 개구리 왕자</button>
      <button class="pick" data-kind="princess">💎 개구리 공주</button>
    </div>
    <div id="ranking" class="hide">
      <h3>🏆 랭킹 TOP 10</h3>
      <ol id="rankList"></ol>
    </div>
    <div class="btns">
      <button id="btn" class="bigBtn">게임 시작</button>
      <button id="homeBtn" class="bigBtn gray hide">처음으로</button>
    </div>
  </div>
</div>
<div id="help">점프: 스페이스바 또는 마우스 클릭 (공중에서 한 번 더 누르면 2단 점프! 하지만 하늘의 새를 조심해)</div>

<script>
// ===== 기본 준비 =====
const canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const GROUND = 400;           // 땅 높이
const STAGE_LEN = 600;        // 한 단계 길이 (약 10초)
const MAX_STAGE = 13;
const MAX_LIVES = 3;          // 하트는 최대 3개
const RANK_KEY = "frogRunRanking";

const overlay = document.getElementById("overlay");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const btn = document.getElementById("btn");
const homeBtn = document.getElementById("homeBtn");
const nameInput = document.getElementById("nameInput");
const nameRow = document.getElementById("nameRow");
const pickRow = document.getElementById("pick");
const rankingBox = document.getElementById("ranking");
const rankList = document.getElementById("rankList");

// 장애물 색깔들
const COLORS = ["#c92a2a", "#d9480f", "#e67700", "#2b8a3e", "#1864ab", "#5f3dc4", "#a61e4d", "#087f5b", "#495057"];

// 캐릭터 고르기
let kind = "prince";
document.querySelectorAll(".pick").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".pick").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    kind = b.dataset.kind;
  });
});

// 지난번에 쓴 닉네임 불러오기
try { nameInput.value = localStorage.getItem("frogRunName") || ""; } catch (e) {}

// 배경 구름
const clouds = [];
for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 120, s: 0.6 + Math.random() * 0.6 });

// ===== 게임 상태 =====
let state = "ready"; // ready, playing, over, clear
let frog, obstacles, coins, hearts, particles;
let stage, stageFrame, speed, lives, coinCount, coinScore, nextObs, nextSky, heartTimer, banner, distance, heartPulse;
let frame = 0, groundX = 0, shake = 0;
let playerName = "개구리";
// 배경이 천천히 바뀌게: 이전 배경(prevThemeIdx)에서 새 배경(themeIdx)으로 themeFade가 0→1로 변해요
let themeIdx = 0, prevThemeIdx = 0, themeFade = 1, placeBanner = true;
const THEME_FADE_FRAMES = 150; // 약 2.5초 동안 스르륵

function resetGame() {
  themeIdx = 0; prevThemeIdx = 0; themeFade = 1; placeBanner = true;
  frog = { x: 150, y: GROUND, vy: 0, jumps: 0, inv: 0, hurt: 0 };
  obstacles = []; coins = []; hearts = []; particles = [];
  stage = 1; stageFrame = 0; speed = 5.5;
  lives = MAX_LIVES; coinCount = 0; coinScore = 0; distance = 0;
  nextObs = 300; nextSky = 600; heartTimer = 2400; // 첫 하트는 한참 뒤에
  banner = 120; frame = 0; groundX = 0; shake = 0; heartPulse = 0;
}

function score() {
  return Math.floor(distance / 10) + coinScore + (state === "clear" ? 1000 : 0);
}

// ===== 조작 =====
function jump() {
  if (state !== "playing") return;
  if (frog.jumps < 2) {
    frog.vy = frog.jumps === 0 ? -14 : -12;
    frog.jumps++;
    dust(frog.x, frog.y);
  }
}
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && state === "playing") {
    e.preventDefault();
    if (!e.repeat) jump(); // 꾹 누르고 있어도 한 번만
  }
});
canvas.addEventListener("mousedown", jump);

function startGame() {
  playerName = nameInput.value.trim() || "개구리";
  try { localStorage.setItem("frogRunName", playerName); } catch (e) {}
  resetGame();
  state = "playing";
  overlay.classList.add("hidden");
  btn.blur(); // 스페이스바가 버튼을 다시 누르지 않게
}
btn.addEventListener("click", startGame);
nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") startGame(); });

// 처음 화면으로 돌아가기 (닉네임·캐릭터 바꾸기)
homeBtn.addEventListener("click", () => {
  titleEl.textContent = "개구리 러닝";
  titleEl.className = "";
  subEl.textContent = "장애물을 뛰어넘고 코인을 모아 13단계까지 달려라!";
  nameRow.classList.remove("hide");
  pickRow.classList.remove("hide");
  rankingBox.classList.add("hide");
  homeBtn.classList.add("hide");
  btn.textContent = "게임 시작";
});

// ===== 랭킹 (이 컴퓨터의 브라우저에 저장돼요) =====
function loadRanking() {
  try { return JSON.parse(localStorage.getItem(RANK_KEY)) || []; } catch (e) { return []; }
}
function saveRecord(rec) {
  const list = loadRanking();
  list.push(rec);
  list.sort((a, b) => b.score - a.score);
  const top = list.slice(0, 10);
  try { localStorage.setItem(RANK_KEY, JSON.stringify(top)); } catch (e) {}
  return top;
}
function showRanking(top, me) {
  rankList.innerHTML = "";
  const head = document.createElement("li");
  head.className = "head";
  ["순위", "닉네임", "단계", "점수"].forEach(t => { const s = document.createElement("span"); s.textContent = t; head.appendChild(s); });
  rankList.appendChild(head);
  top.forEach((r, i) => {
    const li = document.createElement("li");
    if (r === me) li.className = "me";
    [(i + 1) + "등", r.name, r.stage + "단계", r.score + "점"].forEach(t => {
      const s = document.createElement("span"); s.textContent = t; li.appendChild(s);
    });
    rankList.appendChild(li);
  });
  rankingBox.classList.remove("hide");
}

function showEnd(type) {
  state = type;
  const rec = { name: playerName, score: score(), stage: stage };
  const top = saveRecord(rec);
  const inTop = top.includes(rec);

  overlay.classList.remove("hidden");
  nameRow.classList.add("hide");
  pickRow.classList.add("hide");
  homeBtn.classList.remove("hide");
  if (type === "over") {
    titleEl.textContent = "게임 오버";
    titleEl.className = "over";
  } else {
    titleEl.textContent = "클리어!";
    titleEl.className = "clear";
  }
  subEl.textContent = playerName + "님 점수: " + rec.score + "점 (" + stage + "단계, 코인 " + coinCount + "개)" +
    (inTop ? "" : " · 아쉽게 TOP 10에는 못 들었어요");
  showRanking(top, rec);
  btn.textContent = "다시 하기";
}

// ===== 효과 =====
function dust(x, y) {
  for (let i = 0; i < 6; i++) {
    particles.push({ x: x - 10, y, vx: -Math.random() * 2 - 1, vy: -Math.random() * 1.5, size: 4, life: 20, max: 20, color: "#d8c49a" });
  }
}
function burst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * (power || 5) + 1;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: Math.random() * 3 + 2, life: 35, max: 35, color });
  }
}
function sparkles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 4 + 2;
    particles.push({ type: "star", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: 7, life: 35, max: 35, color });
  }
}
function ring(x, y, color, grow) {
  particles.push({ type: "ring", x, y, size: 6, grow, life: 22, max: 22, color });
}
function floatText(x, y, text, color, size) {
  particles.push({ type: "text", x, y, vx: 0, vy: -1.8, text, color, size, life: 50, max: 50 });
}

// ===== 장애물·아이템 만들기 =====
const SIZES = {
  ball:     { w: 36, h: 36 },
  mushroom: { w: 38, h: 44 },
  rock:     { w: 48, h: 32 },
  tall:     { w: 32, h: 66 },
  log:      { w: 92, h: 30 },
  hopper:   { w: 34, h: 34 },
  pit:      { w: 80, h: 0 },  // 땅에 뚫린 구멍 (넓이는 만들 때 정해요)
  bee:      { w: 42, h: 30 },
  bat:      { w: 44, h: 26 },
  bird:     { w: 46, h: 26 },
};

// 장애물 난이도: 쉬움·보통·어려움을 1단계부터 섞어서 내보내요
const EASY   = ["ball", "mushroom", "rock"];
const MEDIUM = ["hopper", "bee", "log", "pit"];
const HARD   = ["tall", "bat"];
// 그 종류(새·박쥐)가 아직 개구리 앞쪽에 날고 있나요?
function skyBusy(type) {
  return obstacles.some(o => o.type === type && o.x + o.w > frog.x - 60);
}
function makeObstacle(x, groundOnly) {
  // 단계가 높을수록 어려운 장애물이 더 자주 나와요
  // (1단계: 쉬움 약 60% · 보통 약 28% · 어려움 약 12%)
  const easyW = 5, midW = 2 + stage * 0.4, hardW = 0.6 + stage * 0.45;
  const r = Math.random() * (easyW + midW + hardW);
  let list = r < easyW ? EASY : r < easyW + midW ? MEDIUM : HARD;
  if (groundOnly) list = list.filter(t => t !== "bee" && t !== "bat" && t !== "pit"); // 붙어서 나올 땐 땅 위 장애물만
  if (stage < 6) list = list.filter(t => t !== "bat"); // 박쥐는 6단계부터 나와요
  let type = list[Math.floor(Math.random() * list.length)];
  // 화면에 새가 날고 있으면 박쥐 대신 선인장 (새와 박쥐가 한꺼번에 오면 못 피해요!)
  if (type === "bat" && skyBusy("bird")) type = "tall";
  return newObstacle(type, x);
}
function newObstacle(type, x) {
  const s = SIZES[type];
  // 구멍은 단계가 높을수록 조금씩 넓어져요 (70~120칸)
  const w = type === "pit" ? Math.min(120, 70 + Math.random() * (15 + stage * 3)) : s.w;
  return {
    type, x, w, h: s.h,
    bottom: type === "bee" ? GROUND - 58 : GROUND,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    phase: Math.random() * 10,
    skyY: GROUND - 188 - Math.random() * 55, // 하늘을 나는 새의 높이 (1단 점프로는 안 닿아요)
  };
}

// 코인 크기를 섞어요: 작은 코인 30점, 보통 코인 50점, 큰 코인 100점 (큰 코인은 가끔만!)
function makeCoin(x, y) {
  const r = Math.random();
  if (r < 0.3) return { x, y, r: 7, value: 30 };    // 작은 코인
  if (r < 0.85) return { x, y, r: 10, value: 50 };  // 보통 코인
  return { x, y, r: 15, value: 100 };               // 큰 코인
}

function spawn() {
  const o = makeObstacle(W + 20, false);
  obstacles.push(o);
  let width = o.w;
  // 1단계부터 가끔 2개가 붙어서 나오고, 7단계부터는 3개까지 붙어요
  const ground = !["bee", "bat", "hopper", "pit"].includes(o.type);
  if (ground && Math.random() < 0.12 + stage * 0.035) {
    const count = stage >= 7 && Math.random() < 0.5 ? 2 : 1;
    let nx = o.x + o.w + 4;
    for (let i = 0; i < count; i++) {
      const extra = makeObstacle(nx, true);
      if (extra.type === "hopper" || extra.type === "log") continue;
      obstacles.push(extra);
      nx += extra.w + 4;
    }
    width = nx - o.x;
  }
  // 코인: 벌 밑에는 땅에, 땅 장애물 위에는 무지개처럼
  if (o.type === "pit" || Math.random() < 0.6) { // 구멍 위에는 항상 코인이 있어요
    const cx = o.x + width / 2;
    if (o.type === "pit") {
      // 구멍을 점프하는 길을 따라 코인 5개 무지개 (가운데가 제일 높아요)
      const span = width + 40;
      for (let i = 0; i < 5; i++) {
        coins.push(makeCoin(o.x - 20 + span * (i / 4), GROUND - 35 - Math.sin((i / 4) * Math.PI) * 60));
      }
    } else if (o.type === "bee") {
      for (let i = -1; i <= 1; i++) coins.push(makeCoin(cx + i * 30, GROUND - 18));
    } else if (ground) {
      const top = Math.max(...obstacles.filter(p => p.x >= o.x).map(p => p.h));
      for (let i = 0; i < 5; i++) {
        coins.push(makeCoin(cx + (i - 2) * 30, GROUND - top - 30 - Math.sin((i / 4) * Math.PI) * 50));
      }
    }
  }
  return width;
}

// ===== 매 순간 계산 =====
function hit(a, b) {
  return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
}

function update() {
  frame++;
  stageFrame++;

  // 단계 올리기
  if (stageFrame >= STAGE_LEN) {
    if (stage === MAX_STAGE) { showEnd("clear"); return; }
    stage++;
    stageFrame = 0;
    banner = 120;
    // 배경이 바뀌는 단계면 천천히 바꾸기 시작
    const ni = themeIndex();
    placeBanner = ni !== themeIdx;
    if (placeBanner) { prevThemeIdx = themeIdx; themeIdx = ni; themeFade = 0; }
  }
  if (themeFade < 1) themeFade = Math.min(1, themeFade + 1 / THEME_FADE_FRAMES);
  speed = 5.5 + (stage - 1) * 0.7; // 단계마다 빨라짐 (13단계는 1단계의 약 2.5배)
  distance += speed;

  // 개구리 점프·떨어지기
  frog.vy += 0.8;
  frog.y += frog.vy;
  // 개구리 발밑에 구멍이 있나요? (가장자리는 살짝 봐줘요. 무적일 땐 구멍 위도 걸을 수 있어요)
  const pit = frog.inv === 0 && obstacles.find(o => o.type === "pit" && frog.x > o.x + 12 && frog.x < o.x + o.w - 12);
  if (pit && frog.y > GROUND) frog.falling = true;   // 구멍으로 쑥 빠지기 시작
  if (frog.y < GROUND) frog.falling = false;          // 재빨리 점프해서 빠져나왔어요!
  if (frog.falling) {
    if (frog.y > GROUND + 45) {
      // 구멍에 빠졌어요! 하트를 하나 잃고 톡 튀어나와요
      frog.falling = false;
      frog.y = GROUND - 1; frog.vy = -16; frog.jumps = 1;
      if (hurtFrog("#8c6a43")) return;
    }
  } else if (frog.y >= GROUND) {
    if (frog.jumps > 0) dust(frog.x, GROUND);
    frog.y = GROUND; frog.vy = 0; frog.jumps = 0;
  }
  if (frog.inv > 0) frog.inv--;
  if (frog.hurt > 0) frog.hurt--;
  if (heartPulse > 0) heartPulse--;

  groundX = (groundX + speed) % 40;
  clouds.forEach(c => { c.x -= c.s; if (c.x < -80) { c.x = W + 40; c.y = 30 + Math.random() * 120; } });

  // 땅 장애물: 단계가 높을수록 간격이 좁아짐
  nextObs -= speed;
  if (nextObs <= 0) {
    const width = spawn();
    const gapMin = speed * (58 - stage * 1.7);
    nextObs = gapMin + width + Math.random() * (260 - stage * 10.8);
  }
  // 하늘 장애물(새): 2단계부터, 점점 자주
  if (stage >= 2) {
    nextSky -= speed;
    if (nextSky <= 0) {
      if (skyBusy("bat")) {
        nextSky = 150; // 박쥐가 지나갈 때까지 조금 기다렸다가 새를 보내요
      } else {
        obstacles.push(newObstacle("bird", W + 30));
        nextSky = Math.max(250, 1000 - stage * 58) + Math.random() * 350;
      }
    }
  }
  // 하트는 가끔 나와요 (하트가 3개보다 적을 때만)
  heartTimer--;
  if (heartTimer <= 0) {
    if (lives < MAX_LIVES) hearts.push({ x: W + 20, y: GROUND - 120 });
    heartTimer = 2100 + Math.random() * 1200; // 하트는 아주 가끔 (35~55초마다)
  }

  // 장애물 움직이기 (종류마다 움직임이 달라요)
  obstacles.forEach(o => {
    if (o.type === "bee") o.x -= speed + 1;
    else if (o.type === "bird") {
      o.x -= speed + 2.5;
      o.bottom = o.skyY + Math.sin(frame * 0.07 + o.phase) * 25; // 위아래로 물결치며 날아요
    } else if (o.type === "bat") {
      o.x -= speed + 1.5;
      // 높이 날다가 개구리 근처에서 아래로 휙 내려와요
      const d = Math.min(1, Math.abs(o.x - frog.x - 40) / 380);
      o.bottom = GROUND - 8 - 170 * d;
    } else if (o.type === "hopper") {
      o.x -= speed;
      o.bottom = GROUND - Math.abs(Math.sin(frame * 0.08 + o.phase)) * 95; // 통통 튀어요
    } else o.x -= speed;
  });
  coins.forEach(c => c.x -= speed);
  hearts.forEach(h => h.x -= speed);
  obstacles = obstacles.filter(o => o.x + o.w > -30);
  coins = coins.filter(c => c.x > -20 && !c.got);
  hearts = hearts.filter(h => h.x > -20 && !h.got);

  // 개구리 몸 상자 (그림보다 살짝 작게 해서 덜 억울하게)
  const fb = { l: frog.x - 18, r: frog.x + 22, t: frog.y - 32, b: frog.y - 4 };

  coins.forEach(c => {
    if (hit(fb, { l: c.x - c.r, r: c.x + c.r, t: c.y - c.r, b: c.y + c.r })) {
      c.got = true; coinCount++; coinScore += c.value;
      const big = c.r >= 14;
      burst(c.x, c.y, "#ffd43b", big ? 32 : 18, big ? 8 : 6);
      sparkles(c.x, c.y, "#fff3a3", big ? 12 : 6);
      ring(c.x, c.y, "#ffd43b", big ? 5 : 3);
      floatText(c.x, c.y - 10, "+" + c.value, "#ffcc00", big ? 30 : c.r <= 7 ? 17 : 22);
    }
  });
  hearts.forEach(h => {
    if (hit(fb, { l: h.x - 16, r: h.x + 16, t: h.y - 16, b: h.y + 16 })) {
      h.got = true;
      lives = Math.min(MAX_LIVES, lives + 1);
      burst(h.x, h.y, "#ff4d6d", 45, 8);
      sparkles(h.x, h.y, "#ffc2d1", 14);
      ring(h.x, h.y, "#ff6b8b", 5);
      ring(h.x, h.y, "#ffffff", 3);
      floatText(h.x, h.y - 20, "+1 ♥", "#ff4d6d", 34);
      heartPulse = 40;
      shake = 6;
    }
  });

  if (frog.inv === 0) {
    for (const o of obstacles) {
      const ob = { l: o.x + 5, r: o.x + o.w - 5, t: o.bottom - o.h + 5, b: o.bottom - 2 };
      if (o.type === "pit") continue; // 구멍은 위에서 따로 확인해요
      if (hit(fb, ob)) {
        frog.vy = Math.min(frog.vy, -6); // 아야! 하고 살짝 튕김
        if (hurtFrog(o.color)) return;
        break;
      }
    }
  }

  updateParticles();
  if (banner > 0) banner--;
}

// 개구리가 다쳤을 때 (게임 오버면 true를 돌려줘요)
function hurtFrog(color) {
  lives--;
  burst(frog.x, frog.y - 20, color, 30, 6);
  shake = 14;
  frog.hurt = 50;   // 아파하는 얼굴
  if (lives <= 0) {
    frog.hurt = Infinity; // 게임 오버면 계속 슬픈 얼굴
    floatText(frog.x + 10, frog.y - 60, "으앙...", "#4dabf7", 28);
    showEnd("over");
    return true;
  }
  floatText(frog.x + 10, frog.y - 60, "아야!", "#e03131", 28);
  frog.inv = 90; // 잠깐 깜빡이며 무적
  return false;
}

function updateParticles() {
  particles.forEach(p => {
    if (p.type === "ring") p.size += p.grow;
    else if (p.type === "text") p.y += p.vy;
    else { p.x += p.vx; p.y += p.vy; p.vy += 0.1; }
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.85;
  if (shake < 0.5) shake = 0;
}

// ===== 그리기 =====
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill(); }

// ===== 단계별 배경 (2단계마다 바뀌어요) =====
const THEMES = [
  { name: "아침 들판", sky: ["#8fd3ff", "#dff4ff"], sun: "#ffe066", cloud: "#ffffff", far: "hill", hill: "#a6e3a1",
    grass: "#6cc04a", blade: "#4fa636", dirt: "#c9a26b", pebble: "#b08a55", hud: "#2f4f2f" },
  { name: "꽃밭", sky: ["#a5d8ff", "#fff0f6"], sun: "#ffe066", cloud: "#ffffff", far: "hill", hill: "#c3fae8",
    grass: "#69db7c", blade: "#40c057", dirt: "#c9a26b", pebble: "#b08a55", deco: "flowers", hud: "#2f4f2f" },
  { name: "깊은 숲", sky: ["#74c0fc", "#d3f9d8"], sun: "#fff3bf", cloud: "#f1f3f5", far: "trees", hill: "#2f9e44", trunk: "#5c3d1e",
    grass: "#37b24d", blade: "#2b8a3e", dirt: "#8c6a43", pebble: "#6f5232", hud: "#1b3a1b" },

    grass: "#e8b36a", blade: "#d29a4f", dirt: "#e0a85f", pebble: "#c48a45", hud: "#5c3a12" },
  { name: "노을 언덕", sky: ["#ff8787", "#ffd8a8"], sun: "#ff922b", sunY: 150, cloud: "#ffc9c9", far: "mountain", hill: "#a14d6a",
    grass: "#5c940d", blade: "#466f0a", dirt: "#7a4b33", pebble: "#5e3826", hud: "#ffffff" },
  { name: "가을 숲", sky: ["#ffd8a8", "#fff3bf"], sun: "#ffe066", cloud: "#ffffff", far: "trees", hill: "#e8590c", trunk: "#5c3d1e",
    grass: "#c47f2c", blade: "#a8641d", dirt: "#8c5a3c", pebble: "#6b4229", weather: "leaves", hud: "#4a2a10" },
  { name: "비 오는 늪", sky: ["#4a5866", "#97a6b4"], cloud: "#6c7a89", far: "hill", hill: "#3f5e45",
    grass: "#3d6b3a", blade: "#2c5229", dirt: "#4f4a3a", pebble: "#3b372b", weather: "rain", hud: "#ffffff" },
  { name: "눈 덮인 산", sky: ["#a5c3dc", "#eef4f9"], sun: "#f8f9fa", cloud: "#ffffff", far: "mountain", hill: "#8aa4bd", cap: true,
    grass: "#f8f9fa", blade: "#dee6ee", dirt: "#c5d0da", pebble: "#a9b6c2", weather: "snow", hud: "#24384d" },
  { name: "별빛 밤", sky: ["#0b1a3a", "#2b3f6b"], moon: "#fff3bf", stars: true, cloud: null, far: "hill", hill: "#1e3a2f",
    grass: "#2b5a3a", blade: "#1f4a2d", dirt: "#3b2f2a", pebble: "#2a211d", hud: "#ffffff" },
  { name: "불타는 화산", sky: ["#2b0a0a", "#8a2a1a"], moon: "#ff8787", cloud: null, far: "volcano", hill: "#3a1d1d",
    grass: "#5a2a1a", blade: "#7a2e12", dirt: "#2b1a14", pebble: "#1a0f0b", weather: "embers", hud: "#ffffff" },
];
const STARS = [];
for (let i = 0; i < 70; i++) STARS.push({ x: Math.random() * W, y: Math.random() * (GROUND - 80), r: Math.random() * 1.6 + 0.4 });

// 13단계 동안 10가지 배경이 골고루 나오게 나눠요
function themeIndex() { return Math.min(THEMES.length - 1, Math.floor(((stage || 1) - 1) * THEMES.length / MAX_STAGE)); }
function theme() { return THEMES[themeIdx]; }

// 새 배경을 따로 그려 둘 숨은 도화지 (예전 배경 위에 살짝씩 진하게 겹쳐 그려요)
const fadeCanvas = document.createElement("canvas");
fadeCanvas.width = W; fadeCanvas.height = H;
const fadeCtx = fadeCanvas.getContext("2d");
function drawScene() {
  if (themeFade >= 1) { drawBackground(THEMES[themeIdx]); return; }
  drawBackground(THEMES[prevThemeIdx]);
  const mainCtx = ctx;
  ctx = fadeCtx;              // 잠깐 숨은 도화지에 그리기
  drawBackground(THEMES[themeIdx]);
  ctx = mainCtx;
  ctx.globalAlpha = themeFade;
  ctx.drawImage(fadeCanvas, 0, 0);
  ctx.globalAlpha = 1;
}
function drawWeatherMix() {
  if (themeFade >= 1) { drawWeather(THEMES[themeIdx]); return; }
  ctx.globalAlpha = 1 - themeFade; drawWeather(THEMES[prevThemeIdx]); // 예전 날씨는 점점 흐려지고
  ctx.globalAlpha = themeFade;     drawWeather(THEMES[themeIdx]);     // 새 날씨는 점점 진해져요
  ctx.globalAlpha = 1;
}
function mod(a, m) { return ((a % m) + m) % m; }

// 멀리 있는 풍경 (천천히 움직여서 깊이감이 나요)
function drawFar(t) {
  const off = (distance || 0) * 0.3;
  const layer = (sp, fn) => {
    const o = mod(off, sp);
    for (let x = -o - sp; x < W + sp; x += sp) fn(x, Math.round((x + off) / sp));
  };
  ctx.fillStyle = t.hill;
  if (t.far === "hill") {
    layer(400, x => { ctx.beginPath(); ctx.ellipse(x + 200, GROUND + 10, 220, 100, 0, Math.PI, 0); ctx.fill(); });
  } else if (t.far === "mountain") {
    layer(300, (x, i) => {
      const hgt = 170 + (i % 3) * 40;
      ctx.fillStyle = t.hill;
      ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + 150, GROUND - hgt); ctx.lineTo(x + 300, GROUND); ctx.fill();
      if (t.cap) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.moveTo(x + 150, GROUND - hgt); ctx.lineTo(x + 115, GROUND - hgt + 50); ctx.lineTo(x + 150, GROUND - hgt + 38); ctx.lineTo(x + 185, GROUND - hgt + 50); ctx.fill();
      }
    });
  } else if (t.far === "trees") {
    layer(110, (x, i) => {
      const hgt = 90 + (mod(i, 3)) * 30;
      ctx.fillStyle = t.trunk; ctx.fillRect(x + 50, GROUND - hgt + 30, 10, hgt - 30);
      ctx.fillStyle = t.hill; circle(x + 55, GROUND - hgt + 20, 34); circle(x + 35, GROUND - hgt + 40, 24); circle(x + 75, GROUND - hgt + 40, 24);
    });
  } else if (t.far === "dune") {
    layer(500, x => { ctx.beginPath(); ctx.ellipse(x + 250, GROUND + 20, 300, 80, 0, Math.PI, 0); ctx.fill(); });
    layer(260, (x, i) => {
      if (mod(i, 2)) return;
      ctx.fillStyle = t.hill2;
      ctx.beginPath(); ctx.roundRect(x + 100, GROUND - 90, 16, 90, 8); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x + 82, GROUND - 70, 10, 30, 5); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x + 124, GROUND - 80, 10, 34, 5); ctx.fill();
      ctx.fillRect(x + 86, GROUND - 46, 16, 8); ctx.fillRect(x + 114, GROUND - 52, 14, 8);
    });
  } else if (t.far === "volcano") {
    layer(560, x => {
      ctx.fillStyle = t.hill;
      ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + 230, GROUND - 230); ctx.lineTo(x + 300, GROUND - 230); ctx.lineTo(x + 530, GROUND); ctx.fill();
      ctx.fillStyle = "#ff6b00";
      ctx.beginPath(); ctx.moveTo(x + 230, GROUND - 230); ctx.lineTo(x + 300, GROUND - 230); ctx.lineTo(x + 275, GROUND - 160); ctx.lineTo(x + 262, GROUND - 120); ctx.lineTo(x + 255, GROUND - 180); ctx.fill();
      ctx.fillStyle = "rgba(255,120,0,0.35)"; circle(x + 265, GROUND - 240, 40 + Math.sin(frame * 0.1) * 5);
    });
  }
}

function drawBackground(t) {
  // 하늘
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, t.sky[0]);
  g.addColorStop(1, t.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 별
  if (t.stars) {
    STARS.forEach((s, i) => {
      ctx.fillStyle = "rgba(255,255,255," + (0.5 + Math.sin(frame * 0.05 + i) * 0.4) + ")";
      circle(s.x, s.y, s.r);
    });
  }
  // 해 / 달
  if (t.sun) {
    const sy = t.sunY || 70;
    ctx.fillStyle = "rgba(255,255,255,0.35)"; circle(W - 100, sy, 46);
    ctx.fillStyle = t.sun; circle(W - 100, sy, 30);
  }
  if (t.moon) {
    ctx.fillStyle = t.moon; circle(W - 110, 75, 28);
    ctx.fillStyle = t.sky[0]; circle(W - 98, 66, 25); // 초승달 모양
  }
  // 구름
  if (t.cloud) {
    ctx.fillStyle = t.cloud;
    clouds.forEach(c => { circle(c.x, c.y, 18); circle(c.x + 20, c.y - 8, 22); circle(c.x + 42, c.y, 18); });
  }
  drawFar(t);
  // 땅
  ctx.fillStyle = t.grass;
  ctx.fillRect(0, GROUND, W, 14);
  ctx.fillStyle = t.dirt;
  ctx.fillRect(0, GROUND + 14, W, H - GROUND);
  // 움직이는 풀 무늬
  ctx.fillStyle = t.blade;
  for (let x = -groundX; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + 6, GROUND - 8); ctx.lineTo(x + 12, GROUND); ctx.fill();
  }
  ctx.fillStyle = t.pebble;
  const po = mod(distance || 0, 80);
  for (let x = -po; x < W; x += 80) { ellipse(x + 30, GROUND + 35, 8, 4); ellipse(x + 70, GROUND + 55, 5, 3); }
  // 꽃
  if (t.deco === "flowers") {
    const fo = mod(distance || 0, 60);
    const fc = ["#ff8fab", "#ffd43b", "#ffffff", "#b197fc"];
    for (let x = -fo, i = 0; x < W; x += 60, i++) {
      ctx.fillStyle = fc[mod(i + Math.floor((distance || 0) / 60), 4)];
      circle(x + 20, GROUND - 4, 4);
      ctx.fillStyle = "#ffd43b"; circle(x + 20, GROUND - 4, 1.5);
    }
  }
}

// 날씨 (비·눈·낙엽·불티) - 맨 앞에 그려요
function drawWeather(t) {
  if (!t.weather) return;
  if (t.weather === "rain") {
    ctx.strokeStyle = "rgba(200,220,255,0.55)"; ctx.lineWidth = 1.5;
    for (let i = 0; i < 90; i++) {
      const x = mod(i * 97 - frame * 4, W), y = mod(i * 53 + frame * 14, H);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14); ctx.stroke();
    }
  } else if (t.weather === "snow") {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    for (let i = 0; i < 70; i++) {
      const x = mod(i * 131 + Math.sin(frame * 0.02 + i) * 20 - frame * 1.5, W), y = mod(i * 71 + frame * 1.2, H);
      circle(x, y, 1.5 + (i % 3));
    }
  } else if (t.weather === "leaves") {
    const lc = ["#e8590c", "#f08c00", "#c92a2a"];
    for (let i = 0; i < 24; i++) {
      const x = mod(i * 157 - frame * 2.5, W), y = mod(i * 89 + frame * 1.3, H);
      ctx.fillStyle = lc[i % 3]; ellipse(x, y, 6, 3, frame * 0.05 + i);
    }
  } else if (t.weather === "embers") {
    for (let i = 0; i < 45; i++) {
      const x = mod(i * 113 - frame * 1.5, W), y = H - mod(i * 67 + frame * 1.8, H);
      ctx.fillStyle = i % 2 ? "rgba(255,140,0,0.8)" : "rgba(255,212,59,0.7)";
      circle(x, y, 1.5 + (i % 3) * 0.7);
    }
  }
}

// 진짜 개구리처럼 옆에서 본 모습 (오른쪽을 봐요)
function drawFrog() {
  const hurt = frog.hurt > 0;
  if (!hurt && frog.inv > 0 && Math.floor(frog.inv / 5) % 2 === 0) return; // 무적일 때 깜빡깜빡
  const x = frog.x;
  const inAir = frog.y !== GROUND; // 구멍에 빠지는 중일 때도 공중 자세
  const bob = inAir || state !== "playing" ? 0 : Math.abs(Math.sin(frame * 0.3)) * 3; // 땅에서는 깡총깡총
  const y = frog.y - bob;
  const body  = kind === "prince" ? "#5cc04a" : "#6fcf5c";  // 밝은 연두색
  const dark  = kind === "prince" ? "#3a8a2e" : "#46a03a";
  const light = kind === "prince" ? "#8edc6e" : "#9fe58a";
  const belly = "#f1f7c8";

  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  // 구멍에 빠지는 중이면 땅속에 들어간 부분은 안 보이게 (구멍 안만 보여요)
  if (frog.y > GROUND) {
    ctx.beginPath();
    ctx.rect(0, 0, W, GROUND);
    obstacles.forEach(o => { if (o.type === "pit") ctx.rect(o.x, GROUND, o.w, H - GROUND); });
    ctx.clip();
  }

  // 왕자님의 빨간 망토 (몸 뒤에서 펄럭펄럭)
  if (kind === "prince") {
    const flap = Math.sin(frame * 0.25) * 4 + (inAir ? -6 : 0);
    ctx.fillStyle = "#c92a2a";
    ctx.beginPath();
    ctx.moveTo(x + 6, y - 30);
    ctx.quadraticCurveTo(x - 20, y - 34 + flap, x - 36, y - 18 + flap);
    ctx.lineTo(x - 30, y - 12 + flap); ctx.lineTo(x - 34, y - 6 + flap);
    ctx.quadraticCurveTo(x - 12, y - 8, x + 2, y - 14);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 2; // 금색 테두리
    ctx.beginPath(); ctx.moveTo(x - 36, y - 18 + flap); ctx.lineTo(x - 30, y - 12 + flap); ctx.lineTo(x - 34, y - 6 + flap); ctx.stroke();
  }

  // 뒷다리 (땅에서는 접고, 공중에서는 뒤로 쭉 뻗어요)
  ctx.fillStyle = dark;
  if (inAir) {
    ellipse(x - 20, y - 12, 14, 6, 0.35);
    ellipse(x - 36, y - 4, 13, 3.5, 0.15);
    ctx.beginPath(); ctx.moveTo(x - 46, y - 4); ctx.lineTo(x - 58, y - 9); ctx.lineTo(x - 56, y - 1); ctx.lineTo(x - 58, y + 4); ctx.closePath(); ctx.fill();
  } else {
    const k = Math.sin(frame * 0.3) * 0.15;
    ellipse(x - 14, y - 13, 14, 9, -0.4 + k);
    ellipse(x - 12, y - 3, 13, 3.5, 0);
    ctx.beginPath(); ctx.moveTo(x - 2, y - 2); ctx.lineTo(x + 8, y - 5); ctx.lineTo(x + 6, y); ctx.lineTo(x + 9, y + 2); ctx.lineTo(x - 2, y + 2); ctx.closePath(); ctx.fill();
  }

  // 몸통 (통통하고 동글동글하게)
  ctx.fillStyle = body;
  ellipse(x, y - 17, 23, 15, -0.12);
  // 머리 (크고 동그랗게 - 머리가 크면 더 귀여워요)
  ellipse(x + 15, y - 22, 15, 12, -0.05);
  // 배
  ctx.fillStyle = belly;
  ellipse(x + 6, y - 9, 16, 6.5, -0.1);
  // 등에 동글동글 밝은 점
  ctx.fillStyle = light;
  circle(x - 10, y - 24, 3); circle(x - 2, y - 28, 2.2); circle(x - 16, y - 16, 2.2);
  // 볼 터치 (분홍 볼)
  ctx.fillStyle = "rgba(255,120,150,0.55)";
  ellipse(x + 20, y - 17, 4.5, 2.8);

  if (kind === "prince") {
    // 가슴에 빛나는 금메달과 빨간 리본
    ctx.fillStyle = "#c92a2a";
    ctx.beginPath(); ctx.moveTo(x + 6, y - 16); ctx.lineTo(x + 10, y - 9); ctx.lineTo(x + 14, y - 16); ctx.fill();
    ctx.fillStyle = "#ffcc00"; circle(x + 10, y - 8, 3.6);
    ctx.fillStyle = "#fff3b0"; circle(x + 9, y - 9, 1.2);
  } else {
    // 공주님의 분홍 발레 치마 (물결 모양)
    ctx.fillStyle = "#ff8fb8";
    ctx.beginPath();
    ctx.moveTo(x - 16, y - 13);
    ctx.quadraticCurveTo(x + 4, y - 18, x + 22, y - 12);
    for (let i = 0; i <= 6; i++) {
      const sx = x + 22 - i * 6.5, sy = y - 3 + (i % 2 ? 2 : 0);
      ctx.lineTo(sx, sy);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffc9de"; // 치마 위쪽 밝은 띠
    ellipse(x + 3, y - 13, 18, 2.5, -0.05);
  }

  // 왕관 / 티아라 (눈보다 먼저 그려서 큰 눈이 앞에 보여요)
  if (kind === "prince") {
    ctx.save();
    ctx.translate(x + 1, y - 33); ctx.rotate(-0.18); // 살짝 뒤로 기울인 왕관
    ctx.fillStyle = "#ffcc00";
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(-11, -13); ctx.lineTo(-5, -7); ctx.lineTo(0, -16);
    ctx.lineTo(5, -7); ctx.lineTo(11, -13); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#e09f00"; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = "#fff3b0"; circle(-11, -13, 1.8); circle(0, -16, 2); circle(11, -13, 1.8); // 끝에 동그란 구슬
    ctx.fillStyle = "#e8b923"; ctx.fillRect(-10, -3, 20, 3);                                  // 아래 띠
    ctx.fillStyle = "#e03131"; circle(0, -4, 2.2);                                            // 빨간 보석
    ctx.fillStyle = "#4dabf7"; circle(-6, -2.5, 1.5); circle(6, -2.5, 1.5);                    // 파란 보석
    ctx.restore();
  } else {
    // 머리 뒤쪽의 커다란 분홍 리본
    ctx.fillStyle = "#f06595";
    ctx.beginPath(); ctx.moveTo(x - 6, y - 31); ctx.lineTo(x - 18, y - 39); ctx.lineTo(x - 17, y - 25); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 6, y - 31); ctx.lineTo(x - 2, y - 43); ctx.lineTo(x + 6, y - 36); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c2255c"; circle(x - 6, y - 31, 3);
    // 반짝이는 티아라
    ctx.save();
    ctx.translate(x + 3, y - 35); ctx.rotate(-0.12);
    ctx.fillStyle = "#e9ecef";
    ctx.beginPath();
    ctx.moveTo(-9, 0); ctx.lineTo(-6, -6); ctx.lineTo(-3, -4); ctx.lineTo(0, -11);
    ctx.lineTo(3, -4); ctx.lineTo(6, -6); ctx.lineTo(9, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#adb5bd"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#f783ac"; circle(0, -5, 2.4);               // 가운데 분홍 보석
    ctx.fillStyle = "#74c0fc"; circle(-5.5, -2, 1.3); circle(5.5, -2, 1.3);
    ctx.fillStyle = "#ffffff"; // 티아라 위 반짝반짝
    drawSparkle(0, -14, 2 + Math.abs(Math.sin(frame * 0.12)) * 2.5);
    ctx.restore();
  }

  // 앞다리
  ctx.strokeStyle = dark; ctx.lineWidth = 4;
  const fl = inAir ? 6 : 0;
  ctx.beginPath(); ctx.moveTo(x + 14, y - 12); ctx.lineTo(x + 18 + fl, y - 3 - fl); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 18 + fl, y - 3 - fl); ctx.lineTo(x + 23 + fl, y - 2 - fl); ctx.stroke();

  // 크고 동그란 눈 (반짝이는 큰 눈동자)
  ctx.fillStyle = body; circle(x + 15, y - 31, 9.5);
  // 가끔 눈을 깜빡여요
  const blink = !hurt && frame % 180 < 7;
  if (hurt) {
    // 아파서 질끈 감은 눈 + 축 처진 눈썹
    ctx.strokeStyle = "#1b1b1b"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(x + 11, y - 35); ctx.lineTo(x + 19, y - 31); ctx.lineTo(x + 11, y - 27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 9, y - 39); ctx.lineTo(x + 20, y - 43); ctx.stroke();
  } else if (blink) {
    ctx.strokeStyle = "#1b1b1b"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(x + 16, y - 32, 5, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  } else {
    ctx.fillStyle = "#ffffff"; circle(x + 16, y - 32, 7);
    ctx.fillStyle = "#1b1b1b"; circle(x + 17.5, y - 31.5, 4.8);
    ctx.fillStyle = "#ffffff"; circle(x + 19.3, y - 33.6, 1.9); circle(x + 16, y - 29.6, 0.9);
    if (kind === "princess") {
      // 공주님의 긴 속눈썹
      ctx.strokeStyle = "#1b1b1b"; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x + 19, y - 38.5); ctx.lineTo(x + 21, y - 42);
      ctx.moveTo(x + 22, y - 36.5); ctx.lineTo(x + 25, y - 39);
      ctx.moveTo(x + 23.3, y - 33.5); ctx.lineTo(x + 26.5, y - 34.5);
      ctx.stroke();
    }
  }

  // 작은 콧구멍
  ctx.fillStyle = "#1b1b1b"; circle(x + 28, y - 24, 0.9);
  ctx.strokeStyle = "#1f4a1a"; ctx.lineWidth = 1.8;
  if (hurt) {
    // 입꼬리가 내려간 입 + 벌린 입 + 눈물 + 식은땀
    ctx.beginPath(); ctx.moveTo(x + 29, y - 15); ctx.quadraticCurveTo(x + 19, y - 22, x + 7, y - 16); ctx.stroke();
    ctx.fillStyle = "#8b1e2d"; ellipse(x + 23, y - 17, 3, 2.2);
    const ty = (frame * 0.8) % 16;
    ctx.fillStyle = "#74c0fc";
    ctx.globalAlpha = 1 - ty / 16;
    circle(x + 19, y - 24 + ty, 2.5);
    ctx.beginPath(); ctx.moveTo(x + 16.6, y - 25 + ty); ctx.lineTo(x + 19, y - 30 + ty); ctx.lineTo(x + 21.4, y - 25 + ty); ctx.fill();
    ctx.globalAlpha = 1;
    circle(x - 6, y - 33, 2.5);
    ctx.beginPath(); ctx.moveTo(x - 8.4, y - 34); ctx.lineTo(x - 6, y - 39); ctx.lineTo(x - 3.6, y - 34); ctx.fill();
  } else {
    // 방긋 웃는 입 (공주님은 분홍 입술)
    if (kind === "princess") { ctx.strokeStyle = "#e64980"; ctx.lineWidth = 2.2; }
    ctx.beginPath(); ctx.moveTo(x + 27, y - 20); ctx.quadraticCurveTo(x + 23, y - 14, x + 17, y - 18); ctx.stroke();
  }
  // 게임 오버면 머리 위에 빙글빙글 별
  if (state === "over") {
    ctx.fillStyle = "#ffd43b";
    for (let i = 0; i < 3; i++) {
      const a = frame * 0.08 + i * (Math.PI * 2 / 3);
      drawSparkle(x + 6 + Math.cos(a) * 16, y - 50 + Math.sin(a) * 5, 5);
    }
  }

  ctx.restore();
}

// 무서운 얼굴: 찢어진 노란 눈 + 날카로운 이빨
function angryFace(cx, cy, s) {
  // 눈 (가운데로 갈수록 내려가는 찢어진 눈)
  ctx.fillStyle = "#ffe066";
  ctx.beginPath(); ctx.moveTo(cx - 10 * s, cy - 4 * s); ctx.lineTo(cx - 2 * s, cy); ctx.lineTo(cx - 9 * s, cy + 2 * s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 10 * s, cy - 4 * s); ctx.lineTo(cx + 2 * s, cy); ctx.lineTo(cx + 9 * s, cy + 2 * s); ctx.closePath(); ctx.fill();
  // 세로로 긴 동공
  ctx.fillStyle = "#111";
  ellipse(cx - 6 * s, cy - 0.5 * s, 0.9 * s, 2 * s); ellipse(cx + 6 * s, cy - 0.5 * s, 0.9 * s, 2 * s);
  // 굵은 눈썹
  ctx.strokeStyle = "#111"; ctx.lineWidth = 3 * s; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - 11 * s, cy - 7 * s); ctx.lineTo(cx - 2 * s, cy - 3 * s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 11 * s, cy - 7 * s); ctx.lineTo(cx + 2 * s, cy - 3 * s); ctx.stroke();
  // 입과 뾰족한 이빨
  ctx.fillStyle = "#2b0a0a";
  ctx.beginPath(); ctx.moveTo(cx - 7 * s, cy + 5 * s); ctx.lineTo(cx + 7 * s, cy + 5 * s); ctx.lineTo(cx + 5 * s, cy + 10 * s); ctx.lineTo(cx - 5 * s, cy + 10 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffffff";
  for (let i = 0; i < 4; i++) {
    const tx = cx - 7 * s + i * 3.5 * s;
    ctx.beginPath(); ctx.moveTo(tx, cy + 5 * s); ctx.lineTo(tx + 3.5 * s, cy + 5 * s); ctx.lineTo(tx + 1.75 * s, cy + 8 * s); ctx.fill();
  }
}

function spikeBall(cx, cy, r, color, rot) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = "#343a40"; // 쇠 가시
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.25) * r, Math.sin(a - 0.25) * r);
    ctx.lineTo(Math.cos(a) * (r + 8), Math.sin(a) * (r + 8));
    ctx.lineTo(Math.cos(a + 0.25) * r, Math.sin(a + 0.25) * r);
    ctx.fill();
  }
  ctx.fillStyle = color; circle(0, 0, r);
  ctx.restore();
  angryFace(cx, cy - 1, 0.9);
}

function drawObstacle(o) {
  const x = o.x, b = o.bottom, w = o.w, h = o.h, cx = x + w / 2;
  ctx.save();
  if (o.type === "pit") {
    // 땅에 뚫린 깜깜한 구멍
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, "#2a1d10"); g.addColorStop(1, "#000000");
    ctx.fillStyle = g;
    ctx.fillRect(x, GROUND, w, H - GROUND);
    ctx.fillStyle = "rgba(0,0,0,0.35)"; // 구멍 안쪽 벽 그림자
    ctx.fillRect(x, GROUND, 8, H - GROUND);
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(x + w - 8, GROUND, 8, H - GROUND);
    // 구멍 가장자리 풀 (둥글게 늘어진 잔디)
    ctx.fillStyle = theme().grass;
    ellipse(x, GROUND + 6, 7, 8); ellipse(x + w, GROUND + 6, 7, 8);
    // 구멍 앞의 조심 표지판
    ctx.fillStyle = "#8b5a2b"; ctx.fillRect(x - 30, GROUND - 26, 4, 26);
    ctx.fillStyle = "#ffd43b";
    ctx.beginPath(); ctx.moveTo(x - 28, GROUND - 44); ctx.lineTo(x - 16, GROUND - 24); ctx.lineTo(x - 40, GROUND - 24); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1b1b1b"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("!", x - 28, GROUND - 27);
  } else if (o.type === "ball") {
    // 데굴데굴 가시공
    spikeBall(cx, b - h / 2, h / 2 - 4, o.color, -frame * 0.15);
  } else if (o.type === "hopper") {
    // 통통 튀는 가시공 (그림자로 어디 떨어질지 보여줘요)
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ellipse(cx, GROUND - 2, 16 - (GROUND - b) / 10, 4);
    spikeBall(cx, b - h / 2, h / 2 - 4, o.color, frame * 0.1);
  } else if (o.type === "mushroom") {
    // 독버섯
    ctx.fillStyle = "#fff4e0";
    ctx.fillRect(cx - 9, b - 24, 18, 24);
    ctx.fillStyle = o.color;
    ctx.beginPath(); ctx.ellipse(cx, b - 24, w / 2, 20, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "rgba(20,0,20,0.45)"; // 독 반점
    circle(cx - 9, b - 34, 4); circle(cx + 8, b - 37, 5); circle(cx + 1, b - 28, 3);
    angryFace(cx, b - 13, 0.7);
  } else if (o.type === "rock") {
    // 심술 바위
    ctx.fillStyle = o.color;
    ctx.beginPath();
    ctx.moveTo(x, b); ctx.lineTo(x + 4, b - h + 8); ctx.quadraticCurveTo(cx, b - h - 6, x + w - 4, b - h + 8); ctx.lineTo(x + w, b);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.12)"; ellipse(cx + 10, b - 8, 8, 4);
    angryFace(cx, b - h / 2 - 2, 0.85);
  } else if (o.type === "log") {
    // 가시 박힌 긴 통나무
    ctx.fillStyle = "#8b5a2b";
    ctx.beginPath(); ctx.roundRect(x, b - h, w, h, 8); ctx.fill();
    ctx.fillStyle = "#c08a4f"; ellipse(x + w - 6, b - h / 2, 6, h / 2 - 2);
    ctx.strokeStyle = "#6b4220"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x + w - 6, b - h / 2, 5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = o.color;
    for (let sx = x + 6; sx < x + w - 12; sx += 14) {
      ctx.beginPath(); ctx.moveTo(sx, b - h); ctx.lineTo(sx + 5, b - h - 10); ctx.lineTo(sx + 10, b - h); ctx.fill();
    }
    angryFace(x + 22, b - h / 2, 0.7);
  } else if (o.type === "tall") {
    // 키다리 가시 선인장
    ctx.fillStyle = o.color;
    ctx.beginPath(); ctx.roundRect(x + 4, b - h, w - 8, h, 12); ctx.fill();
    ctx.strokeStyle = "#212529"; ctx.lineWidth = 2;
    for (let yy = b - h + 10; yy < b - 4; yy += 12) {
      ctx.beginPath(); ctx.moveTo(x + 4, yy); ctx.lineTo(x - 2, yy - 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w - 4, yy + 6); ctx.lineTo(x + w + 2, yy + 3); ctx.stroke();
    }
    angryFace(cx, b - h + 18, 0.75);
  } else if (o.type === "bee") {
    // 붕붕 벌 (낮게 떠다님 - 점프하면 부딪혀요!)
    const cy = b - h / 2 + Math.sin(frame * 0.2 + o.phase) * 3;
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    const flap = Math.abs(Math.sin(frame * 0.8)) * 6;
    ellipse(cx + 2, cy - 12, 9, 4 + flap / 2, -0.4); ellipse(cx + 12, cy - 11, 7, 3 + flap / 2, 0.4);
    ctx.fillStyle = o.color; ellipse(cx, cy, w / 2, h / 2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(cx - 2, cy - h / 2 + 2, 5, h - 4); ctx.fillRect(cx + 8, cy - h / 2 + 4, 4, h - 8);
    ctx.fillStyle = "#2b2b2b";
    ctx.beginPath(); ctx.moveTo(x + w - 2, cy); ctx.lineTo(x + w + 8, cy + 2); ctx.lineTo(x + w - 2, cy + 5); ctx.fill();
    angryFace(cx - 10, cy, 0.6);
  } else if (o.type === "bird") {
    // 하늘을 나는 새 (2단 점프하면 부딪혀요!)
    const cy = b - h / 2;
    const flap = Math.sin(frame * 0.4 + o.phase) * 12;
    ctx.fillStyle = o.color;
    ctx.beginPath(); ctx.moveTo(cx + 4, cy - 2); ctx.lineTo(cx - 10, cy - 8 - flap); ctx.lineTo(cx - 14, cy - 2); ctx.fill();
    ellipse(cx, cy, 20, 10);
    circle(cx - 14, cy - 4, 9); // 머리 (왼쪽을 봐요)
    ctx.fillStyle = "#ffb000";
    ctx.beginPath(); ctx.moveTo(cx - 22, cy - 6); ctx.lineTo(cx - 32, cy - 2); ctx.lineTo(cx - 22, cy); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.moveTo(cx + 18, cy - 4); ctx.lineTo(cx + 28, cy - 10); ctx.lineTo(cx + 26, cy + 4); ctx.fill();
    ctx.fillStyle = "#ff3b3b"; circle(cx - 16, cy - 6, 2.6); // 빨간 눈
    ctx.fillStyle = "#111"; ellipse(cx - 16.5, cy - 6, 0.8, 2);
    ctx.strokeStyle = "#111"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx - 21, cy - 12); ctx.lineTo(cx - 12, cy - 8); ctx.stroke();
    // 날카로운 발톱
    ctx.strokeStyle = "#343a40"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 2, cy + 9); ctx.lineTo(cx - 5, cy + 15); ctx.moveTo(cx + 4, cy + 9); ctx.lineTo(cx + 1, cy + 15); ctx.stroke();
  } else if (o.type === "bat") {
    // 휙 내려오는 박쥐
    const cy = b - h / 2;
    const flap = Math.sin(frame * 0.5) * 8;
    ctx.fillStyle = "#3b2f5c";
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx - 24, cy - 8 - flap); ctx.lineTo(cx - 18, cy + 2); ctx.lineTo(cx - 10, cy - 2);
    ctx.moveTo(cx, cy); ctx.lineTo(cx + 24, cy - 8 - flap); ctx.lineTo(cx + 18, cy + 2); ctx.lineTo(cx + 10, cy - 2);
    ctx.fill();
    ctx.fillStyle = o.color; circle(cx, cy, 10);
    ctx.beginPath(); ctx.moveTo(cx - 8, cy - 6); ctx.lineTo(cx - 6, cy - 16); ctx.lineTo(cx - 2, cy - 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 8, cy - 6); ctx.lineTo(cx + 6, cy - 16); ctx.lineTo(cx + 2, cy - 8); ctx.fill();
    ctx.fillStyle = "#ff3b3b"; circle(cx - 4, cy - 1, 2); circle(cx + 4, cy - 1, 2);
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.moveTo(cx - 3, cy + 4); ctx.lineTo(cx - 1.5, cy + 8); ctx.lineTo(cx, cy + 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 3, cy + 4); ctx.lineTo(cx + 1.5, cy + 8); ctx.lineTo(cx, cy + 4); ctx.fill();
  }
  ctx.restore();
}

function drawCoin(c) {
  const r = c.r;
  const sx = Math.abs(Math.cos(frame * 0.1 + c.x * 0.02)); // 빙글빙글 도는 느낌
  ctx.save();
  if (r >= 14) { ctx.shadowColor = "#ffd43b"; ctx.shadowBlur = 14; } // 큰 코인은 반짝반짝 빛나요
  ctx.fillStyle = "#e6a800"; ellipse(c.x, c.y, r * sx + 1, r);
  ctx.restore();
  ctx.fillStyle = "#ffd43b"; ellipse(c.x, c.y, r * 0.7 * sx + 0.5, r * 0.7);
  if (r >= 14) {
    ctx.fillStyle = "#fff9db";
    drawSparkle(c.x + r * 0.6, c.y - r * 0.7, 4 + Math.abs(Math.sin(frame * 0.15)) * 3);
  }
}

function drawHeart(hh) {
  const y = hh.y + Math.sin(frame * 0.1) * 4;
  ctx.save();
  ctx.shadowColor = "#ff6b8b"; ctx.shadowBlur = 16;
  ctx.fillStyle = "#ff4d6d";
  heartShape(hh.x, y, 15);
  ctx.restore();
}
function heartShape(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.7);
  ctx.bezierCurveTo(x - s * 1.3, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.3, y - s * 0.1, x, y + s * 0.7);
  ctx.fill();
}

// 4갈래 반짝이 별
function drawSparkle(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.25, y - s * 0.25);
  ctx.lineTo(x + s, y); ctx.lineTo(x + s * 0.25, y + s * 0.25);
  ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.25, y + s * 0.25);
  ctx.lineTo(x - s, y); ctx.lineTo(x - s * 0.25, y - s * 0.25);
  ctx.closePath(); ctx.fill();
}

function drawParticles() {
  particles.forEach(p => {
    const k = p.life / p.max;
    ctx.globalAlpha = k;
    if (p.type === "ring") {
      ctx.strokeStyle = p.color; ctx.lineWidth = 4 * k + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === "star") {
      ctx.fillStyle = p.color; drawSparkle(p.x, p.y, p.size * k + 2);
    } else if (p.type === "text") {
      ctx.font = "900 " + p.size + "px sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff";
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.fillStyle = p.color; circle(p.x, p.y, p.size);
    }
  });
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // 목숨 (빈 하트도 보여줘요, 하트를 먹으면 콩닥)
  for (let i = 0; i < MAX_LIVES; i++) {
    const pulse = i === lives - 1 && heartPulse > 0 ? 1 + Math.sin(heartPulse * 0.4) * 0.35 : 1;
    ctx.fillStyle = i < lives ? "#ff4d6d" : "rgba(0,0,0,0.15)";
    heartShape(26 + i * 30, 28, 12 * pulse);
  }
  // 코인과 점수
  ctx.fillStyle = "#e6a800"; circle(26, 58, 10);
  ctx.fillStyle = "#ffd43b"; circle(26, 58, 7);
  ctx.fillStyle = theme().hud; // 어두운 배경에서는 흰 글씨
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("× " + coinCount, 42, 65);
  ctx.fillText("점수 " + score(), 16, 95);
  ctx.fillText(playerName, 130, 35);
  // 단계와 진행 막대
  ctx.textAlign = "right";
  ctx.fillText(stage + " / " + MAX_STAGE + " 단계", W - 16, 30);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.fillRect(W - 196, 40, 180, 10);
  ctx.fillStyle = "#3cb44b";
  ctx.fillRect(W - 196, 40, 180 * (stageFrame / STAGE_LEN), 10);

  // 단계 알림
  if (banner > 0) {
    ctx.globalAlpha = Math.min(1, banner / 30);
    ctx.textAlign = "center";
    ctx.font = "900 50px sans-serif";
    ctx.lineWidth = 6; ctx.strokeStyle = "#1f6b2c";
    const text = stage + "단계!";
    ctx.strokeText(text, W / 2, 150); ctx.fillStyle = "#fff3b0"; ctx.fillText(text, W / 2, 150);
    const tips = { 1: "땅에 뚫린 구멍에 빠지지 않게 점프!",2: "하늘에 새가 나타났어요!", 5: "어려운 장애물이 더 자주 나와요!",
                   6: "휙 내려오는 박쥐 등장!", 7: "장애물이 3개까지 붙어요!", 10: "새가 더 자주 날아와요!", 13: "마지막 단계!" };
    const tip = tips[stage] || (stage > 1 ? "더 빨라져요!" : "");
    ctx.font = "bold 22px sans-serif";
    ctx.lineWidth = 4;
    if (tip) {
      ctx.strokeText(tip, W / 2, 185); ctx.fillStyle = "#ffffff"; ctx.fillText(tip, W / 2, 185);
    }
    if (placeBanner) { // 배경이 바뀔 때 장소 이름
      const place = "📍 " + theme().name;
      ctx.strokeText(place, W / 2, 218); ctx.fillStyle = "#fff3b0"; ctx.fillText(place, W / 2, 218);
    }
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawScene();
  if (frog) {
    coins.forEach(drawCoin);
    hearts.forEach(drawHeart);
    obstacles.forEach(drawObstacle);
    drawFrog();
    drawParticles();
  }
  drawWeatherMix();
  ctx.restore();
  if (frog) drawHUD();
}

// ===== 게임 반복 =====
function loop() {
  if (state === "playing") update();
  else if (particles) { // 끝난 뒤에도 효과·눈물은 마저 보여주기
    frame++;
    updateParticles();
    if (frog.y < GROUND) { frog.vy += 0.8; frog.y = Math.min(GROUND, frog.y + frog.vy); } // 공중에서 끝나면 땅으로 떨어지기
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
