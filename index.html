<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우주 정복</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0820;
    color: #fff;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 16px;
    border: 3px solid #4b3d8f;
    background: #120c33;
    cursor: crosshair;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(11, 8, 32, 0.75);
    border-radius: 16px;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #title {
    font-size: clamp(36px, 9vw, 72px);
    font-weight: 900;
    color: #ffd6f0;
    text-shadow: 0 0 20px #ff6ec7, 0 4px 0 #7a2a6b;
  }
  #title.over  { color: #ff8a8a; text-shadow: 0 0 20px #ff3b3b, 0 4px 0 #6b1a1a; }
  #title.clear { color: #b8ffcf; text-shadow: 0 0 20px #3bff8a, 0 4px 0 #1a6b3a; }
  #sub { font-size: clamp(14px, 3vw, 18px); color: #cfc8ff; line-height: 1.6; }
  #btn {
    font-family: inherit;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: bold;
    padding: 14px 36px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(#ff9ad5, #ff5fb0);
    color: #fff;
    box-shadow: 0 6px 0 #a3336f;
    cursor: pointer;
  }
  #btn:hover  { filter: brightness(1.1); }
  #btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a3336f; }
  #help { margin-top: 12px; font-size: 14px; color: #9a92d6; text-align: center; }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="overlay">
    <div id="title">우주 정복</div>
    <div id="sub">토끼 우주선을 타고 외계인들을 물리쳐라!</div>
    <button id="btn">게임 시작!</button>
  </div>
</div>
<div id="help">이동: ← → 방향키 또는 마우스 &nbsp;|&nbsp; 발사: 스페이스바 또는 마우스 클릭</div>

<script>
// ===== 기본 준비 =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById("overlay");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const btn = document.getElementById("btn");

// 줄마다 다른 외계인 색 (몸 색, 진한 색)
const ROW_COLORS = [
  ["#ff8fd1", "#c24d93"], // 분홍
  ["#ffb35c", "#c2711f"], // 주황
  ["#8ef08a", "#3e9c3a"], // 초록
  ["#7fd3ff", "#2f86b8"], // 하늘
];
// 줄마다 다른 말랑 몸 모양 (가로 크기, 세로 크기, 울퉁불퉁 개수, 울퉁불퉁 정도)
const ROW_SHAPES = [
  { sx: 22, sy: 16, bumps: 3, amp: 0.12 }, // 넓적하고 크게 출렁
  { sx: 16, sy: 21, bumps: 5, amp: 0.08 }, // 길쭉이
  { sx: 25, sy: 13, bumps: 4, amp: 0.10 }, // 납작이
  { sx: 19, sy: 18, bumps: 7, amp: 0.06 }, // 동글 오돌토돌
];
const ROWS = 4, COLS = 8;

// 배경 별
const stars = [];
for (let i = 0; i < 90; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.3, s: Math.random() * 0.6 + 0.2 });
}

// ===== 게임 상태 =====
let state = "ready"; // ready, playing, over, clear
let player, bullets, enemyBullets, aliens, alienDir, alienSpeed, score, lastShot, enemyShotTimer, tick;
let particles = [];
let shake = 0;      // 화면 흔들림 세기
let muzzle = 0;     // 발사할 때 번쩍임
const keys = {};
let mouseDown = false;

function resetGame() {
  player = { x: W / 2, y: H - 60, speed: 6 };
  bullets = [];
  enemyBullets = [];
  particles = [];
  aliens = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      aliens.push({
        x: 120 + c * 72, y: 75 + r * 58, row: r, alive: true,
        face: Math.floor(Math.random() * 4),   // 표정은 하나하나 랜덤
        phase: Math.random() * Math.PI * 2,    // 출렁이는 박자도 제각각
        size: 0.9 + Math.random() * 0.2,       // 크기도 살짝씩 다르게
      });
    }
  }
  alienDir = 1;
  alienSpeed = 0.6;
  score = 0;
  lastShot = 0;
  enemyShotTimer = 0;
  tick = 0;
  shake = 0;
}

// ===== 조작 =====
document.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
document.addEventListener("keyup", (e) => { keys[e.code] = false; });

// 마우스 위치를 캔버스 좌표로 바꾸기 (화면 크기가 달라도 맞게)
canvas.addEventListener("mousemove", (e) => {
  if (state !== "playing") return;
  const rect = canvas.getBoundingClientRect();
  player.x = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener("mousedown", () => { mouseDown = true; });
document.addEventListener("mouseup", () => { mouseDown = false; });

btn.addEventListener("click", () => {
  resetGame();
  state = "playing";
  overlay.classList.add("hidden");
  btn.blur(); // 스페이스바가 버튼을 다시 누르지 않게
});

function shoot(now) {
  if (now - lastShot < 280) return; // 너무 빨리 못 쏘게
  lastShot = now;
  bullets.push({ x: player.x, y: player.y - 34 });
  muzzle = 6;
}

function showEnd(type) {
  state = type;
  overlay.classList.remove("hidden");
  if (type === "over") {
    titleEl.textContent = "게임 오버";
    titleEl.className = "over";
    subEl.textContent = "점수: " + score;
  } else {
    titleEl.textContent = "클리어!";
    titleEl.className = "clear";
    subEl.textContent = "외계인을 모두 물리쳤어요! 점수: " + score;
  }
  btn.textContent = "다시 하기";
}

// ===== 효과 =====
// 크게 터지는 효과: 파편 + 퍼지는 고리 + 번쩍임 + 화면 흔들림
function boom(x, y, color, big) {
  const n = big ? 90 : 35;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * (big ? 9 : 6) + 1;
    particles.push({
      type: "dot", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      size: Math.random() * 4 + 2, life: 40, max: 40,
      color: Math.random() < 0.3 ? "#ffffff" : color,
    });
  }
  // 반짝이 별 조각
  for (let i = 0; i < (big ? 20 : 8); i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 4 + 2;
    particles.push({ type: "star", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: 6, life: 35, max: 35, color: "#fff6a8" });
  }
  particles.push({ type: "ring", x, y, size: 5, grow: big ? 6 : 4, life: 20, max: 20, color });
  particles.push({ type: "flash", x, y, size: big ? 90 : 45, life: 8, max: 8, color: "#ffffff" });
  shake = Math.max(shake, big ? 18 : 6);
}

function updateParticles() {
  particles.forEach(p => {
    if (p.type === "ring") p.size += p.grow;
    else if (p.vx !== undefined) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; }
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.85;
  if (shake < 0.5) shake = 0;
  if (muzzle > 0) muzzle--;
}

// ===== 매 순간 계산 =====
function update(now) {
  tick++;

  // 우주선 이동
  if (keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["ArrowRight"]) player.x += player.speed;
  player.x = Math.max(34, Math.min(W - 34, player.x));

  // 발사
  if (keys["Space"] || mouseDown) shoot(now);

  // 내 총알 이동 + 꼬리 반짝이
  bullets.forEach(b => {
    b.y -= 10;
    if (tick % 2 === 0) {
      particles.push({ type: "dot", x: b.x + (Math.random() - 0.5) * 6, y: b.y + 18, vx: (Math.random() - 0.5), vy: 1, size: 2.5, life: 15, max: 15, color: "#7ff6ff" });
    }
  });
  bullets = bullets.filter(b => b.y > -30);

  // 외계인 무리 이동: 벽에 닿으면 아래로 내려오고 방향 바꾸기
  const alive = aliens.filter(a => a.alive);
  let hitWall = false;
  alive.forEach(a => {
    a.x += alienDir * alienSpeed;
    if (a.x < 32 || a.x > W - 32) hitWall = true;
  });
  if (hitWall) {
    alienDir *= -1;
    alive.forEach(a => { a.y += 18; a.x += alienDir * alienSpeed; });
  }
  // 남은 외계인이 적을수록 빨라짐
  alienSpeed = 0.6 + (ROWS * COLS - alive.length) * 0.07;

  // 외계인 총알 발사 (각 칸의 가장 아래 외계인이 쏨)
  enemyShotTimer--;
  if (enemyShotTimer <= 0 && alive.length > 0) {
    const shooter = alive[Math.floor(Math.random() * alive.length)];
    const bottom = alive.filter(a => Math.abs(a.x - shooter.x) < 5).sort((p, q) => q.y - p.y)[0];
    enemyBullets.push({ x: bottom.x, y: bottom.y + 20 });
    enemyShotTimer = 40 + Math.random() * 50;
  }
  enemyBullets.forEach(b => b.y += 4);
  enemyBullets = enemyBullets.filter(b => b.y < H + 20);

  // 내 총알이 외계인에 맞았는지
  bullets.forEach(b => {
    alive.forEach(a => {
      if (a.alive && !b.hit && Math.abs(b.x - a.x) < 24 && Math.abs(b.y - a.y) < 22) {
        a.alive = false;
        b.hit = true;
        score += (ROWS - a.row) * 10;
        boom(a.x, a.y, ROW_COLORS[a.row][0], false);
      }
    });
  });
  bullets = bullets.filter(b => !b.hit);

  updateParticles();

  // 외계인 총알에 맞으면 게임 오버
  for (const b of enemyBullets) {
    if (Math.abs(b.x - player.x) < 26 && Math.abs(b.y - player.y) < 26) {
      boom(player.x, player.y, "#ffb0dc", true);
      showEnd("over");
      return;
    }
  }
  // 외계인이 우주선 높이까지 내려오면 게임 오버
  if (alive.some(a => a.y + 20 >= player.y - 28)) {
    boom(player.x, player.y, "#ffb0dc", true);
    showEnd("over");
    return;
  }
  // 다 물리치면 클리어
  if (aliens.every(a => !a.alive)) showEnd("clear");
}

// ===== 그리기 =====
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function drawStars() {
  stars.forEach(s => {
    if (state === "playing") { s.y += s.s; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    ctx.fillStyle = "rgba(255,255,255," + (0.4 + s.r / 3) + ")";
    circle(s.x, s.y, s.r);
  });
}

// 토끼가 타고 있는 우주선
function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // 엔진 불꽃 두 개 (깜빡깜빡)
  const f = 12 + Math.sin(tick * 0.6) * 5;
  [-12, 12].forEach(ex => {
    ctx.fillStyle = "#ff7a3d";
    ctx.beginPath(); ctx.moveTo(ex - 6, 18); ctx.lineTo(ex, 18 + f + 4); ctx.lineTo(ex + 6, 18); ctx.fill();
    ctx.fillStyle = "#ffe066";
    ctx.beginPath(); ctx.moveTo(ex - 3, 18); ctx.lineTo(ex, 18 + f - 2); ctx.lineTo(ex + 3, 18); ctx.fill();
  });

  // 날개
  ctx.fillStyle = "#8c7bff";
  ctx.beginPath(); ctx.moveTo(-22, 2); ctx.lineTo(-38, 20); ctx.lineTo(-18, 16); ctx.fill();
  ctx.beginPath(); ctx.moveTo(22, 2); ctx.lineTo(38, 20); ctx.lineTo(18, 16); ctx.fill();

  // 우주선 몸통 (아래쪽 접시)
  ctx.fillStyle = "#e9e4ff";
  ctx.beginPath(); ctx.ellipse(0, 8, 30, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#b9adff";
  ctx.beginPath(); ctx.ellipse(0, 12, 26, 6, 0, 0, Math.PI); ctx.fill();
  // 반짝이는 불빛
  ["#ff6fae", "#ffe066", "#7ff6ff"].forEach((c, i) => {
    ctx.fillStyle = (Math.floor(tick / 10) + i) % 3 === 0 ? "#ffffff" : c;
    circle(-14 + i * 14, 10, 2.5);
  });

  // 유리 돔 안쪽
  ctx.fillStyle = "rgba(160, 220, 255, 0.35)";
  ctx.beginPath(); ctx.arc(0, 2, 20, Math.PI, 0); ctx.fill();

  // 돔 안의 토끼
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 2, 19, Math.PI, 0); ctx.clip(); // 돔 밖으로 안 나가게
  const earWiggle = Math.sin(tick * 0.15) * 0.12;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.ellipse(-6, -10, 4, 10, -0.2 + earWiggle, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -10, 4, 10, 0.2 - earWiggle, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffa3cf";
  ctx.beginPath(); ctx.ellipse(-6, -10, 2, 7, -0.2 + earWiggle, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -10, 2, 7, 0.2 - earWiggle, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffffff";
  circle(0, 0, 9); // 얼굴
  ctx.fillStyle = "#2b2150";
  circle(-3.5, -1, 1.6); circle(3.5, -1, 1.6); // 눈
  ctx.fillStyle = "#ff6fae";
  circle(0, 2, 1.3); // 코
  ctx.fillStyle = "rgba(255,120,170,0.55)";
  circle(-6, 2.5, 1.8); circle(6, 2.5, 1.8); // 볼
  ctx.restore();

  // 유리 돔 테두리와 반사광
  ctx.strokeStyle = "rgba(220, 240, 255, 0.9)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 2, 20, Math.PI, 0); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 2, 15, Math.PI * 1.15, Math.PI * 1.4); ctx.stroke();

  // 발사할 때 번쩍
  if (muzzle > 0) {
    ctx.fillStyle = "rgba(127, 246, 255, " + muzzle / 6 + ")";
    circle(0, -24, 8 + (6 - muzzle) * 2);
  }

  ctx.restore();
}

// 말랑말랑 슬라임 외계인: 몸이 계속 꿀렁거리고, 줄마다 모양·색이 다르고, 표정은 하나하나 다름
function drawAlien(a) {
  const [body, dark] = ROW_COLORS[a.row];
  const shape = ROW_SHAPES[a.row];
  const t = tick * 0.08 + a.phase;
  const squish = 1 + Math.sin(t * 1.5) * 0.06; // 숨 쉬듯 늘었다 줄었다

  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.scale(a.size * squish, a.size / squish);

  // 울퉁불퉁한 몸 테두리 점 만들기 (아래는 바닥에 녹아 붙은 듯 납작하게)
  const pts = [];
  const N = 28;
  for (let i = 0; i < N; i++) {
    const ang = (i / N) * Math.PI * 2;
    const r = 1 + shape.amp * Math.sin(ang * shape.bumps + t) + 0.05 * Math.sin(ang * 2 - t * 1.3);
    let px = Math.cos(ang) * shape.sx * r;
    let py = Math.sin(ang) * shape.sy * r;
    if (py > shape.sy * 0.6) py = shape.sy * 0.6 + (py - shape.sy * 0.6) * 0.25;
    pts.push([px, py]);
  }
  // 점들을 부드럽게 이어서 그리기
  ctx.fillStyle = body;
  ctx.beginPath();
  let mx = (pts[N - 1][0] + pts[0][0]) / 2, my = (pts[N - 1][1] + pts[0][1]) / 2;
  ctx.moveTo(mx, my);
  for (let i = 0; i < N; i++) {
    const p = pts[i], q = pts[(i + 1) % N];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.fill();

  // 양옆으로 흐물흐물 뻗은 작은 팔
  const arm = Math.sin(t * 2) * 3;
  circle(-shape.sx - 2, 2 + arm, 4.5);
  circle(shape.sx + 2, 2 - arm, 4.5);

  // 몸에 반짝이는 하이라이트
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.beginPath(); ctx.ellipse(-shape.sx * 0.45, -shape.sy * 0.55, 4, 2.5, -0.5, 0, Math.PI * 2); ctx.fill();

  // 표정 (4가지 중 하나)
  ctx.fillStyle = "#2b2150";
  ctx.strokeStyle = "#2b2150";
  ctx.lineWidth = 1.6;
  ctx.lineCap = "round";
  if (a.face === 0) {        // 점 눈 + 길쭉한 웃음
    circle(-5, -3, 1.8); circle(5, -3, 1.8);
    ctx.beginPath(); ctx.moveTo(-6, 3); ctx.quadraticCurveTo(0, 6, 6, 3); ctx.stroke();
  } else if (a.face === 1) { // 웃는 눈 ^ ^
    ctx.beginPath(); ctx.arc(-5, -2, 2.5, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(5, -2, 2.5, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 3, 2.5, 0, Math.PI); ctx.stroke();
  } else if (a.face === 2) { // 윙크 + 메롱
    circle(-5, -3, 1.8);
    ctx.beginPath(); ctx.moveTo(3, -3); ctx.lineTo(7, -3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, 3); ctx.lineTo(4, 3); ctx.stroke();
    ctx.fillStyle = "#ff6f8f";
    ctx.beginPath(); ctx.arc(1.5, 3.5, 2.2, 0, Math.PI); ctx.fill();
  } else {                   // 놀란 얼굴
    ctx.fillStyle = "#fff"; circle(-5, -3, 3.2); circle(5, -3, 3.2);
    ctx.fillStyle = "#2b2150"; circle(-5, -3, 1.6); circle(5, -3, 1.6);
    ctx.beginPath(); ctx.ellipse(0, 4, 2, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 볼
  ctx.fillStyle = dark;
  ctx.globalAlpha = 0.35;
  circle(-10, 2, 2.5); circle(10, 2, 2.5);
  ctx.globalAlpha = 1;

  ctx.restore();
}

// 빛나는 레이저 총알
function drawBullet(b) {
  // 꼬리 (아래로 갈수록 투명해짐)
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + 30);
  g.addColorStop(0, "rgba(127,246,255,0.9)");
  g.addColorStop(1, "rgba(127,246,255,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(b.x - 4, b.y); ctx.lineTo(b.x + 4, b.y); ctx.lineTo(b.x, b.y + 30); ctx.fill();
  // 빛나는 머리
  ctx.save();
  ctx.shadowColor = "#7ff6ff";
  ctx.shadowBlur = 18;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.ellipse(b.x, b.y, 3.5, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 빙글빙글 도는 작은 별빛
  const a = tick * 0.4;
  ctx.fillStyle = "#ff9ad5";
  circle(b.x + Math.cos(a) * 7, b.y + Math.sin(a) * 3, 2);
  circle(b.x - Math.cos(a) * 7, b.y - Math.sin(a) * 3, 2);
}

// 외계인 총알 (꿀렁이는 보라 빛 구슬)
function drawEnemyBullet(b) {
  const r = 5 + Math.sin(tick * 0.4 + b.x) * 1.2;
  ctx.save();
  ctx.shadowColor = "#c77dff";
  ctx.shadowBlur = 14;
  ctx.fillStyle = "#d9a6ff";
  circle(b.x, b.y, r);
  ctx.restore();
  ctx.fillStyle = "#ffffff";
  circle(b.x - 1.5, b.y - 1.5, 1.6);
}

// 4갈래 반짝이 별 모양
function drawSparkle(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.25, y - s * 0.25);
  ctx.lineTo(x + s, y); ctx.lineTo(x + s * 0.25, y + s * 0.25);
  ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.25, y + s * 0.25);
  ctx.lineTo(x - s, y); ctx.lineTo(x - s * 0.25, y - s * 0.25);
  ctx.closePath(); ctx.fill();
}

function drawParticles() {
  particles.forEach(p => {
    const k = p.life / p.max;
    ctx.globalAlpha = k;
    if (p.type === "ring") {
      ctx.strokeStyle = p.color; ctx.lineWidth = 4 * k + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === "flash") {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, "rgba(255,255,255,0.9)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g; circle(p.x, p.y, p.size);
    } else if (p.type === "star") {
      ctx.fillStyle = p.color; drawSparkle(p.x, p.y, p.size * k + 2);
    } else {
      ctx.fillStyle = p.color; circle(p.x, p.y, p.size * (0.4 + k * 0.6));
    }
  });
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = "#120c33";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawStars();

  if (player) { // 시작 전에는 별만 보여주기
    aliens.forEach(a => { if (a.alive) drawAlien(a); });
    bullets.forEach(drawBullet);
    enemyBullets.forEach(drawEnemyBullet);
    if (state !== "over") drawShip(player.x, player.y);
    drawParticles();
  }
  ctx.restore();

  if (!player) return;
  // 점수
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("점수: " + score, 16, 30);
  ctx.textAlign = "right";
  ctx.fillText("남은 외계인: " + aliens.filter(a => a.alive).length, W - 16, 30);
}

// ===== 게임 반복 =====
function loop(now) {
  if (state === "playing") update(now);
  else { tick = (tick || 0) + 1; updateParticles(); } // 끝난 뒤에도 터지는 효과는 마저 보여주기
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
